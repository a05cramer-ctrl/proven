name: PROVEN test
run-name: "test #${{ inputs.id }}"
on:
  workflow_dispatch:
    inputs:
      id:
        description: Test id
        required: true
concurrency:
  group: proven-${{ inputs.id }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node runner/run.mjs
        env:
          TEST_ID: ${{ inputs.id }}
          PROVEN_API: ${{ vars.PROVEN_API }}
          PROVEN_MODEL: ${{ vars.PROVEN_MODEL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FILEBASE_IPFS_TOKEN: ${{ secrets.FILEBASE_IPFS_TOKEN }}
